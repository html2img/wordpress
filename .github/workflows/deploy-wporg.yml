# Deploys the plugin to the wordpress.org SVN repository (plugins.svn.wordpress.org/html2img).
#
# Two ways to run it:
#   - Push a tag like v1.2.0        -> real deploy: trunk, tags/1.2.0 and assets are committed to SVN.
#   - "Run workflow" in the Actions -> dry run: builds everything and prints the `svn status` of what
#     tab (workflow_dispatch)          would be committed, but commits nothing. Safe to run any time.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SVN_USERNAME  the wordpress.org username (html2img)
#   SVN_PASSWORD  the SVN password from the wordpress.org profile's Account & Security screen
#
# What ships is the working tree minus .distignore entries (trunk), plus assets-wporg/ into SVN /assets.
name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, must match readme.txt Stable tag (e.g. 1.1.0)'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Dry run' || 'Deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the release version matches the code
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          STABLE=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '[:space:]')
          HEADER=$(sed -n 's/^ \* Version:[[:space:]]*//p' html2img.php | tr -d '[:space:]')
          CONSTANT=$(sed -n "s/^define( 'HTML2IMG_VERSION', '\([^']*\)' );.*/\1/p" html2img.php)
          echo "releasing: $VERSION | readme.txt Stable tag: $STABLE | plugin header: $HEADER | HTML2IMG_VERSION: $CONSTANT"
          if [ "$VERSION" != "$STABLE" ] || [ "$VERSION" != "$HEADER" ] || [ "$VERSION" != "$CONSTANT" ]; then
            echo "::error::Version mismatch. readme.txt Stable tag, the Version header and HTML2IMG_VERSION in html2img.php must all be $VERSION before releasing."
            exit 1
          fi

      - name: Deploy to the wordpress.org SVN repository
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: html2img
          ASSETS_DIR: assets-wporg
          VERSION: ${{ inputs.version }}

      - name: Upload the shipped zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: html2img-${{ inputs.version || github.ref_name }}
          path: ${{ steps.deploy.outputs.zip-path }}
          if-no-files-found: warn
