<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body { width: 100vw; height: 100vh; overflow: hidden; }
	body {
		font-family: 'Inter', system-ui, sans-serif;
		background: {{background_color}};
		color: #f8fafc;
		display: flex;
	}
	.text {
		width: 56vw;
		height: 100vh;
		padding: 5.5vw 5vw 5.5vw 6vw;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
	}
	.brand { display: flex; align-items: center; gap: 1.4vw; }
	.brand img { height: 3.8vw; width: auto; }
	.brand span { font-size: 1.8vw; font-weight: 600; color: #cbd5e1; letter-spacing: 0.04em; }
	h1 {
		font-weight: 700;
		line-height: 1.14;
		letter-spacing: -0.015em;
		display: -webkit-box;
		-webkit-line-clamp: 5;
		-webkit-box-orient: vertical;
		overflow: hidden;
	}
	h1.title-l  { font-size: 5.2vw; }
	h1.title-m  { font-size: 4.5vw; }
	h1.title-s  { font-size: 3.9vw; }
	h1.title-xs { font-size: 3.3vw; }
	.meta { font-size: 1.7vw; color: #94a3b8; }
	.meta strong { color: #e2e8f0; font-weight: 600; }
	.figure {
		width: 44vw;
		height: 100vh;
		position: relative;
		overflow: hidden;
	}
	.figure img {
		width: 100%;
		height: 100%;
		object-fit: cover;
		display: block;
	}
	.figure .edge {
		position: absolute;
		top: 0; left: 0; bottom: 0;
		width: 0.9vw;
		background: {{accent_color}};
	}
	.fallback {
		width: 100%;
		height: 100%;
		background:
			radial-gradient(circle at 30% 20%, {{accent_color}} 0, transparent 55%),
			radial-gradient(circle at 80% 80%, {{accent_color}} 0, transparent 45%),
			{{background_color}};
		opacity: 0.85;
	}
</style>
</head>
<body>
	<div class="text">
		<div class="brand">
			{{#logo}}<img src="{{logo}}" alt="">{{/logo}}
			{{#site_name}}<span>{{site_name}}</span>{{/site_name}}
		</div>
		<h1 class="{{title_class}}">{{title}}</h1>
		<div class="meta">
			{{#author}}<strong>{{author}}</strong> &middot; {{/author}}{{date}}
		</div>
	</div>
	<div class="figure">
		{{#featured_image}}<img src="{{featured_image}}" alt="">{{/featured_image}}
		{{^featured_image}}<div class="fallback"></div>{{/featured_image}}
		<div class="edge"></div>
	</div>
</body>
</html>
