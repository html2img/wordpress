<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body { width: 100vw; height: 100vh; overflow: hidden; }
	body {
		font-family: 'Inter', system-ui, sans-serif;
		background: {{background_color}};
		color: #fff;
		position: relative;
	}
	.photo {
		position: absolute;
		inset: 0;
	}
	.photo img {
		width: 100%;
		height: 100%;
		object-fit: cover;
		display: block;
	}
	.scrim {
		position: absolute;
		inset: 0;
		background: linear-gradient(to top, rgba(2, 6, 23, 0.88) 0%, rgba(2, 6, 23, 0.35) 55%, rgba(2, 6, 23, 0.15) 100%);
	}
	.stage {
		position: absolute;
		inset: 0;
		padding: 5.5vw 6vw;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
	}
	.brand {
		display: inline-flex;
		align-items: center;
		gap: 1.2vw;
		align-self: flex-start;
		background: rgba(2, 6, 23, 0.55);
		border-radius: 10vw;
		padding: 1vw 2vw;
	}
	.brand img { height: 3vw; width: auto; }
	.brand span { font-size: 1.7vw; font-weight: 600; letter-spacing: 0.03em; }
	.bottom { max-width: 82vw; }
	h1 {
		font-weight: 800;
		line-height: 1.1;
		letter-spacing: -0.015em;
		text-shadow: 0 0.2vw 1.6vw rgba(2, 6, 23, 0.6);
		display: -webkit-box;
		-webkit-line-clamp: 3;
		-webkit-box-orient: vertical;
		overflow: hidden;
	}
	h1.title-l  { font-size: 6vw; }
	h1.title-m  { font-size: 5.1vw; }
	h1.title-s  { font-size: 4.4vw; }
	h1.title-xs { font-size: 3.8vw; }
	.rule { width: 9vw; height: 0.6vw; border-radius: 0.3vw; background: {{accent_color}}; margin: 2vw 0 1.6vw; }
	.meta { font-size: 1.9vw; color: #e2e8f0; }
</style>
</head>
<body>
	<div class="photo">
		{{#featured_image}}<img src="{{featured_image}}" alt="">{{/featured_image}}
	</div>
	<div class="scrim"></div>
	<div class="stage">
		<div class="brand">
			{{#logo}}<img src="{{logo}}" alt="">{{/logo}}
			{{#site_name}}<span>{{site_name}}</span>{{/site_name}}
		</div>
		<div class="bottom">
			<h1 class="{{title_class}}">{{title}}</h1>
			<div class="rule"></div>
			<div class="meta">{{#author}}{{author}} &middot; {{/author}}{{date}}</div>
		</div>
	</div>
</body>
</html>
